# Copy to inventory/hosts.yml (gitignored? no: keep it, IPs are not secrets) and fill in.
# Groups:
#   eu_candidates  - Phase 1 shoot-out servers (same stack on all of them)
#   eu             - the winner (production foreign exit)
#   standby        - optional warm spare in a different AS
#   msk            - Moscow exit node (Phase 4)
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  children:
    eu_candidates:
      hosts:
        hostkey-hel:
          ansible_host: 1.2.3.4
          site_role: eu
        timeweb-ams:
          ansible_host: 5.6.7.8
          site_role: eu
    eu:
      hosts: {}
    standby:
      hosts: {}
    msk:
      hosts: {}
